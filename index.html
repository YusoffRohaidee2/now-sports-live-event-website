<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Now Sports Live Event | Sports Hub Official</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23ef4444'/></svg>" type="image/svg+xml">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
        }
        .glass-panel {
            background: rgba(18, 24, 38, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glow-effect {
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.15);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- Header Navigation -->
    <header class="glass-panel sticky top-0 z-50 px-6 py-4 border-b border-gray-800">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-4">
                <img src="https://i.ibb.co/w37XMJR/download-3.png" alt="Now Sports Logo" class="h-10 object-contain">
                <div class="hidden sm:block border-l border-gray-700 pl-4">
                    <span class="text-xs text-blue-400 font-bold tracking-widest block uppercase">Now Sports Live Event</span>
                    <span class="text-xs text-gray-400">by Sports Hub Official</span>
                </div>
            </div>
            
            <div class="flex items-center">
                <span class="bg-gray-500/10 text-gray-400 border border-gray-500/30 text-xs font-bold px-3 py-1 rounded-full flex items-center gap-2">
                    <span class="w-2 h-2 bg-gray-500 rounded-full"></span> CLOSED
                </span>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-7xl mx-auto px-4 py-8 w-full flex-grow flex flex-col items-center justify-center">
        <div class="max-w-2xl w-full text-center">
            <div class="glass-panel rounded-2xl p-8 md:p-12 glow-effect border border-red-500/20 flex flex-col items-center justify-center">
                <div class="w-16 h-16 bg-red-500/10 border border-red-500/30 rounded-full flex items-center justify-center mb-6 text-red-400 text-2xl">
                    <i class="fas fa-lock"></i>
                </div>
                <h1 class="text-2xl md:text-3xl font-extrabold text-white mb-4">This website is closed</h1>
                <p class="text-gray-400 text-sm md:text-base leading-relaxed mb-8">
                    Please wait for other live events on Whatsapp & the official Sports Hub Dashboard
                </p>
                <a href="https://sports-hub-official-dashboard.vercel.app/" class="inline-flex items-center gap-2 bg-red-600 hover:bg-red-700 text-white font-semibold text-sm px-6 py-3 rounded-xl transition duration-200 shadow-lg shadow-red-600/20">
                    <i class="fas fa-house"></i> Back to main menu
                </a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="glass-panel border-t border-gray-800 py-6 text-center text-xs text-gray-500">
        <p>&copy; 2026 Now Sports Live Event | Sports Hub Official. All Rights Reserved.</p>
    </footer>

</body>
</html>
