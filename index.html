<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Now Sports Live Event | Sports Hub Official</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Montserrat:wght@800&display=swap" rel="stylesheet">

    <!-- DevTools Protection -->
    <script disable-devtool-auto src="https://cdn.jsdelivr.net/npm/disable-devtool"></script>
    
    <!-- Ad Scripts -->
    <script id="aclib" type="text/javascript" src="//acscdn.com/script/aclib.js"></script>
    <script type="text/javascript">
        aclib.runPop({ zoneId: '11159258' });
        aclib.runPop({ zoneId: '10298126' });
    </script>

    <script>window.CHANNEL_ID = "hyundai_aff_cup_2026";</script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0b0f19; }
        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
        .animate-marquee {
            animation: marquee 25s linear infinite;
        }
    </style>
</head>
<body class="text-gray-100 min-h-screen flex flex-col justify-between select-none">

    <!-- Header -->
    <header class="border-b border-gray-800 bg-gray-900/50 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/0d/Now_logo.svg/960px-Now_logo.svg.png?_=20210604170013" alt="Now Logo" class="h-10 object-contain">
                <span class="text-xs uppercase tracking-widest bg-red-600 text-white font-bold px-2 py-0.5 rounded-sm animate-pulse">Live Event</span>
            </div>
        </div>
    </header>

    <!-- Running Ticker -->
    <div class="bg-red-600 text-white py-2 overflow-hidden whitespace-nowrap font-bold text-sm tracking-wide shadow-inner">
        <div class="inline-block animate-marquee uppercase">
            🔥 HYUNDAI AFF CUP 2026 LIVE MATCHES &nbsp;|&nbsp; Stream Live via Official Embed Player &nbsp;|&nbsp; High-bitrate Secure Stream &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
        </div>
    </div>

    <!-- Main Content -->
    <main class="max-w-5xl mx-auto px-4 py-8 flex-grow w-full">
        <div class="text-center max-w-3xl mx-auto mb-8 flex flex-col items-center">
            <img src="https://content.aseanutdfc.com/cdn-cgi/image/onerror=redirect,format=auto,metadata=none/prod/digital_campaign/2026/79371783644558-96d6f2.png" alt="AFF Cup Logo" class="h-20 md:h-28 object-contain mb-3">
            <p class="text-gray-400 text-sm md:text-base leading-relaxed">
                Official Live Streaming Coverage for Hyundai AFF Cup 2026.
            </p>
        </div>

        <div class="bg-gray-900 rounded-2xl border border-gray-800 overflow-hidden shadow-2xl mb-8">
            <div class="p-4 bg-gray-950 border-b border-gray-800 flex items-center justify-between">
                <div class="flex items-center space-x-4">
                    <img id="current-logo" src="https://raw.githubusercontent.com/apistech/project/refs/heads/main/logo/imageCir_RCTI-180x180_2025_11_06_13_09_06.jpg" alt="Channel Logo" class="h-12 w-12 object-contain bg-black/40 p-1 rounded-lg border border-gray-700">
                    <div>
                        <span class="text-xs text-red-500 font-bold uppercase tracking-wider">Now Streaming</span>
                        <h2 id="current-channel-name" class="text-lg font-bold text-white">RCTI</h2>
                    </div>
                </div>
            </div>

            <!-- Player Container -->
            <div class="relative aspect-video bg-black flex justify-center items-center">
                <iframe id="main-iframe" src="https://player.icanplay.my.id/?url=https://rctiplus.icanplay.my.id/rcti.m3u8" class="w-full h-full border-0" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
            </div>
        </div>

        <!-- Channel Selector Buttons / Grid -->
        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-4">
            <h3 class="text-sm font-bold uppercase tracking-wider text-gray-400 mb-3">Pilih Saluran:</h3>
            <div id="channel-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3">
                <!-- Channels diisi secara dinamik -->
            </div>
        </div>
    </main>

    <footer class="border-t border-gray-800 bg-gray-950 py-6 text-center text-xs text-gray-600">
        <p>&copy; 2026 Now Sports Live Event by Sports Hub Official. All rights reserved.</p>
    </footer>

    <script>
        const channels = [
            {
                name: "RCTI",
                logo: "https://raw.githubusercontent.com/apistech/project/refs/heads/main/logo/imageCir_RCTI-180x180_2025_11_06_13_09_06.jpg",
                embedUrl: "https://player.icanplay.my.id/?url=https://rctiplus.icanplay.my.id/rcti.m3u8"
            },
            {
                name: "MNCTV",
                logo: "https://raw.githubusercontent.com/apistech/project/refs/heads/main/logo/imageCir_MNC-180x180_2025_11_06_13_06_02.jpg",
                embedUrl: "https://player.icanplay.my.id/?url=https://rctiplus.icanplay.my.id/mnctv.m3u8"
            },
            {
                name: "GTV",
                logo: "https://raw.githubusercontent.com/apistech/project/refs/heads/main/logo/imageCir_GTV-180x180_2025_11_06_13_07_56.jpg",
                embedUrl: "https://player.icanplay.my.id/?url=https://rctiplus.icanplay.my.id/gtv.m3u8"
            },
            {
                name: "iNews",
                logo: "https://raw.githubusercontent.com/apistech/project/refs/heads/main/logo/image_ch_inews.png",
                embedUrl: "https://player.icanplay.my.id/?url=https://rctiplus.icanplay.my.id/inews.m3u8"
            }
        ];

        // Fungsi Tukar Saluran
        function loadChannel(index) {
            const ch = channels[index];
            document.getElementById('current-channel-name').innerText = ch.name;
            document.getElementById('current-logo').src = ch.logo;
            document.getElementById('main-iframe').src = ch.embedUrl;
        }

        // Render Button Saluran
        const channelGrid = document.getElementById('channel-grid');
        channels.forEach((ch, idx) => {
            const btn = document.createElement('button');
            btn.className = "flex items-center space-x-3 p-3 bg-gray-950 hover:bg-gray-800 border border-gray-800 rounded-xl transition text-left w-full";
            btn.onclick = () => loadChannel(idx);
            btn.innerHTML = `
                <img src="${ch.logo}" class="h-8 w-8 object-contain bg-black/50 p-0.5 rounded">
                <div class="overflow-hidden">
                    <div class="text-sm font-semibold text-white truncate">${ch.name}</div>
                    <div class="text-xs text-gray-500">Global Feed | Indonesia</div>
                </div>
            `;
            channelGrid.appendChild(btn);
        });

        // Sekat Menu Klik Kanan
        document.addEventListener('contextmenu', e => e.preventDefault());
    </script>
</body>
</html>
